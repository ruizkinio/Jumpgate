name: Setup support
description: Request help with Jumpgate setup using sanitized, non-private information.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: |
        Read SUPPORT.md first. Never post configured addon URLs, Stremio install links, pairing codes, management links, IDs, tokens, provider/debrid URLs or headers, signed media URLs, cookies, credentials, raw logs, dumps, or account screenshots.
  - type: checkboxes
    id: support_checks
    attributes:
      label: Public request checks
      options:
        - label: This is not a security vulnerability or suspected cross-profile data exposure.
          required: true
        - label: I removed all private URLs, capabilities, credentials, identifiers, provider details, and raw logs.
          required: true
        - label: I followed the setup order in README.md and paired before installing the generated addon.
          required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - APK selection or installation
        - External-player chooser or Android defaults
        - Pairing or profiles
        - Browser account link or provider import
        - Trakt or TMDB setup
        - Stream playback
        - Local history or resume
        - Subtitles
        - Returning to Stremio or repeat playback
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Coordinated release versions
      placeholder: "Jumpgate 3.0.0; Bridge 3.0.0; Stremio x.y.z"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Sanitized device environment
      placeholder: "Device model; Android/API; arm64-v8a or armeabi-v7a"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Describe steps and stable error messages only. Do not paste a configured URL, provider response, or full log.
    validations:
      required: true
